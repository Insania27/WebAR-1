<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Задание 2</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <a href="./index.html">На главную</a>
  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets><a-asset-item id="model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: ambient; intensity: 1.5"></a-entity>
    <a-entity light="type: directional; intensity: 2" position="1 2 1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 0"><a-gltf-model src="#model" position="0 0 0.1" scale="0.18 0.18 0.18"></a-gltf-model></a-entity>
  </a-scene>
</body>
</html>
